name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare GitHub release
        shell: pwsh
        run: |
          $tag = "v$(node -p "require('./package.json').version")"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build signed installer
        run: npm run dist:win
        env:
          # Optional self-signed / PFX signing certificate, base64 encoded.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload release assets
        shell: pwsh
        run: |
          $tag = "v$(node -p "require('./package.json').version")"
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Name -match '^Shen-.*-Setup\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml'
          }
          gh release upload $tag @($assets.FullName) --clobber
          gh release upload $tag build/shen-codesign.pem --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
